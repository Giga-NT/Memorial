<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<filter id="granite" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="19" stitchTiles="stitch" result="noise"/>
  <feColorMatrix in="noise" type="matrix" values="0.20 0 0 0 0.005  0 0.20 0 0 0.005  0 0 0.22 0 0.008  0 0 0 1 0" result="dark"/>
  <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" stitchTiles="stitch" result="cloud"/>
  <feColorMatrix in="cloud" type="saturate" values="0" result="gray"/>
  <feComponentTransfer in="gray" result="speckle">
    <feFuncR type="table" tableValues="0.025 0.11"/>
    <feFuncG type="table" tableValues="0.025 0.11"/>
    <feFuncB type="table" tableValues="0.03 0.13"/>
  </feComponentTransfer>
  <feBlend in="dark" in2="speckle" mode="screen"/>
</filter>
<rect width="512" height="512" fill="#08090a" filter="url(#granite)"/>
</svg>